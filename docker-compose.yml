services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talleres-app
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:latest
    container_name: talleres-db
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: yourpassword
      MARIADB_DATABASE: talleres
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: talleres-phpmyadmin
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: always

volumes:
  db_data:


networks:
  default:
    name: "talleres-network"
