services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX}app
    ports:
      - "${APP_HTTP_PORT}:80"
      - "${APP_HTTPS_PORT}:443"
    environment:
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    depends_on:
      - db
    restart: always
    networks:
      - talleres
    deploy:
      resources:
        limits:
          cpus: '${APP_MAX_CPU}'
          memory: ${APP_MAX_MEM}
        reservations:
          cpus: '${APP_RESERVED_CPU}'
          memory: ${APP_RESERVED_MEM}

  db:
    image: mariadb:11.4.2
    container_name: ${CONTAINER_PREFIX}db
    ports:
      # Exports?
      - "${DB_PORT}:3306"
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      - talleres
    deploy:
      resources:
        limits:
          cpus: '${DB_MAX_CPU}'
          memory: ${DB_MAX_MEM}
        reservations:
          cpus: '${DB_RESERVED_CPU}'
          memory: ${DB_RESERVED_MEM}

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: ${CONTAINER_PREFIX}phpmyadmin
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      - db
    restart: always
    networks:
      - talleres
    deploy:
      resources:
        limits:
          cpus: '${PMA_MAX_CPU}'
          memory: ${PMA_MAX_MEM}
        reservations:
          cpus: '${PMA_RESERVED_CPU}'
          memory: ${PMA_RESERVED_MEM}

volumes:
  db_data:


networks:
  talleres:
    driver: bridge
